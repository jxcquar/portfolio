<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <title>Showcase — Jacqueline Tenges</title>
  <meta name="description" content="Showcase — a flip-through deck of visual work by Jacqueline Tenges, senior product designer." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌼</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,500;1,600&family=Crimson+Text:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Roboto:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=93" />
</head>
<body data-page="showcase" class="showcase-page">

  <nav class="pill-nav pill-nav--top" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="index.html#work">Work</a>
    <a href="showcase.html" aria-current="page">Showcase</a>
    <a href="about.html">About</a>
  </nav>

  <header class="deck-head">
    <h1><i>ux, ui and everything in between</i></h1>
    <p class="deck-sub"><span class="deck-sub-icon" aria-hidden="true"></span><span id="deckCount">10 pages</span></p>
  </header>

  <main class="deck-stage" id="deckStage" aria-label="Showcase deck — flip through the pages">
    <div class="deck" id="deck">
      <!-- One .deck-card per page. To add a page: copy a block, point it at a
           1400px-wide JPEG in assets/, keep real width/height. Order = deck order. -->
      <figure class="deck-card">
        <img src="assets/sc-challenges.jpg" width="1400" height="915" alt="Fabra Challenge" draggable="false" />
        <figcaption>Fabra - Challenge competition 2026</figcaption>
      </figure>
       <figure class="deck-card">
        <img src="assets/fabra-bobble.png" width="1400" height="1200" alt="Fabra bobble" draggable="false" />
        <figcaption>Fabra - Marketing Page</figcaption>
      </figure>
      <figure class="deck-card">
        <img src="assets/scape-field-services-2.png" width="1400" height="1200" alt="Scape Field Services App" draggable="false" />
        <figcaption>Scape Field Services</figcaption>
      </figure>
      <figure class="deck-card">
        <img src="assets/ai-pjp-2.png" width="1400" height="1200" alt="Freelancer AI on Post a Job" draggable="false" />
        <figcaption>Freelancer AI on Post a Job</figcaption>
      </figure>
      <figure class="deck-card">
        <img src="assets/freelancer-bits.png" width="1400" height="1200" alt="Bits design system" draggable="false" />
        <figcaption>Bits Design System</figcaption>
      </figure>
      <figure class="deck-card">
        <img src="assets/freelancer-share.png" width="1400" height="1200" alt="Freelancer Invite and Share initiative" draggable="false" />
        <figcaption>Freelancer Invite and Share initiative</figcaption>
      </figure>
      <figure class="deck-card">
        <img src="assets/freelancer-giveget.png" width="1600" height="1200" alt="Freelancer Give Get" draggable="false" />
        <figcaption>Freelancer Give & Get</figcaption>
      </figure>
      <figure class="deck-card">
        <img src="assets/freelancer-invite.png" width="1590" height="652" alt="Freelancer Share" draggable="false" />
        <figcaption>Freelancer Share</figcaption>
      </figure>
      <figure class="deck-card">
        <img src="assets/freelancer-project.png" width="1600" height="836" alt="Freelancer Project" draggable="false" />
        <figcaption>Freelancer Viewing a Project</figcaption>
      </figure>
      <figure class="deck-card">
        <img src="assets/sc-panel-figma.jpg" width="1400" height="840" alt="Editor panel explorations in Figma" draggable="false" />
        <figcaption>Panel explorations in Figma</figcaption>
      </figure>
    </div>
  </main>

  <div class="deck-controls">
    <button class="deck-arrow" id="deckPrev" aria-label="Previous page">&#8592;</button>
    <span class="deck-counter" id="deckCounter" aria-live="polite">1 / 10</span>
    <button class="deck-arrow" id="deckNext" aria-label="Next page">&#8594;</button>
  </div>

  <p class="deck-caption" id="deckCaption" aria-live="polite"></p>

  <p class="deck-hint" id="deckHint">Drag, scroll or use the arrows to flip</p>

  <script src="js/main.js?v=93"></script>
</body>
</html>
